[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["bfmhno3"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/bfmhno3/pebble"
description = "Pebble: a small scripting language and toolchain, built from scratch in Rust."
keywords = ["language", "interpreter", "compiler", "vm", "learning"]
categories = ["development-tools", "compilers"]

[workspace.dependencies]
# --- internal crates ---------------------------------------------------------
pebble-span = { path = "crates/pebble-span", version = "0.1.0" }
pebble-diag = { path = "crates/pebble-diag", version = "0.1.0" }
pebble-lexer = { path = "crates/pebble-lexer", version = "0.1.0" }
pebble-ast = { path = "crates/pebble-ast", version = "0.1.0" }
pebble-macros = { path = "crates/pebble-macros", version = "0.1.0" }
pebble-parser = { path = "crates/pebble-parser", version = "0.1.0" }
pebble-value = { path = "crates/pebble-value", version = "0.1.0" }
pebble-interp = { path = "crates/pebble-interp", version = "0.1.0" }
pebble-bytecode = { path = "crates/pebble-bytecode", version = "0.1.0" }
pebble-gc = { path = "crates/pebble-gc", version = "0.1.0" }
pebble-vm = { path = "crates/pebble-vm", version = "0.1.0" }
pebble-sys = { path = "crates/pebble-sys", version = "0.1.0" }
pebble-nostd = { path = "crates/pebble-nostd", version = "0.1.0" }
pebble-net = { path = "crates/pebble-net", version = "0.1.0" }
pebble-cli = { path = "crates/pebble-cli", version = "0.1.0" }

# --- external ----------------------------------------------------------------
anyhow = "1"
cc = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
criterion = { version = "0.8", features = ["html_reports"] }
proc-macro2 = "1"
quote = "1"
rand = "0.10"
rustyline = "18"
syn = { version = "3", features = ["full"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
    "sync",
    "time",
    "signal",
] }

[workspace.lints.rust]
rust_2018_idioms = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
