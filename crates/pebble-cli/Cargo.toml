[package]
name = "pebble-cli"
description = "The pebble command-line driver: run, compile, disassemble, repl."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pebble"
path = "src/main.rs"

[dependencies]
pebble-span.workspace = true
pebble-diag.workspace = true
pebble-lexer.workspace = true
pebble-ast.workspace = true
pebble-parser.workspace = true
pebble-value.workspace = true
pebble-interp.workspace = true
pebble-bytecode.workspace = true
pebble-vm.workspace = true
anyhow.workspace = true
clap.workspace = true
rustyline = { workspace = true, optional = true }

[features]
default = ["repl"]
# The interactive `pebble repl` subcommand (pulls in the line editor).
repl = ["dep:rustyline"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints]
workspace = true
